# Anita Project - 生产环境 Nginx 配置示例
# 适用于端口 10001 的部署

server {
    listen 10001;
    server_name 172.16.38.135 anita.yourdomain.com;

    # 访问日志和错误日志
    access_log /var/log/nginx/anita-access.log;
    error_log /var/log/nginx/anita-error.log warn;

    # 前端静态文件根目录
    root /var/www/anita-project/frontend/dist;
    index index.html;

    # ============================================================
    # 前端路由 - SPA应用，所有路由指向 index.html
    # ============================================================
    location / {
        try_files $uri $uri/ /index.html;

        # 前端文件缓存策略
        # HTML文件不缓存（确保更新）
        location ~* \.html$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            expires 0;
        }

        # 静态资源缓存30天
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # ============================================================
    # API 请求代理到后端服务
    # ============================================================
    location /api/ {
        proxy_pass http://localhost:3000;

        # 代理请求头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时配置（适应长时间测试）
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # WebSocket 支持（如果需要）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ============================================================
    # 截图文件代理 - 关键配置
    # ============================================================
    location /screenshots/ {
        # 代理到后端Express静态文件服务
        proxy_pass http://localhost:3000/screenshots/;

        # 代理请求头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # 截图缓存策略（7天）
        proxy_cache_valid 200 7d;
        proxy_cache_valid 404 1m;
        proxy_cache_bypass $http_cache_control;

        # 响应头优化
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff";

        # 超时设置
        proxy_connect_timeout 10s;
        proxy_send_timeout 10s;
        proxy_read_timeout 30s;

        # 错误处理
        proxy_intercept_errors on;
        error_page 404 = @screenshot_not_found;
    }

    # 截图404处理
    location @screenshot_not_found {
        return 404 '{"error": "Screenshot not found", "message": "截图文件不存在或已过期"}';
        add_header Content-Type application/json;
    }

    # ============================================================
    # 折扣规则工具输出文件
    # ============================================================
    location /discount-rule-output/ {
        proxy_pass http://localhost:3000/discount-rule-output/;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=3600";
    }

    # ============================================================
    # 健康检查端点
    # ============================================================
    location /health {
        proxy_pass http://localhost:3000/health;
        proxy_set_header Host $host;
        access_log off;  # 健康检查不记录日志
    }

    # ============================================================
    # 安全配置
    # ============================================================

    # 隐藏Nginx版本号
    server_tokens off;

    # 防止点击劫持
    add_header X-Frame-Options "SAMEORIGIN" always;

    # XSS保护
    add_header X-XSS-Protection "1; mode=block" always;

    # MIME类型嗅探保护
    add_header X-Content-Type-Options "nosniff" always;

    # 引用策略
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ============================================================
    # Gzip 压缩
    # ============================================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/rss+xml
        font/truetype
        font/opentype
        application/vnd.ms-fontobject
        image/svg+xml;

    # ============================================================
    # 客户端最大请求体大小（上传文件限制）
    # ============================================================
    client_max_body_size 100M;

    # ============================================================
    # 错误页面
    # ============================================================
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        return 502 '{"error": "Service Unavailable", "message": "后端服务暂时不可用，请稍后重试"}';
        add_header Content-Type application/json;
    }
}

